packages:
  - "apps/*"
  - "packages/*"
  - "packages/features/*"

catalog:
  typescript: 6.0.3
  vitest: 5.0.3
  "@vitest/coverage-v8": 5.0.3
  zod: 4.6.5
  eslint: 10.12.0
  prettier: 3.9.9
  turbo: 2.11.7
  typescript-eslint: 8.71.0
  "@eslint/js": 10.0.1

# @sentry/cli compiles native upload binaries. Milestone 0 does not upload source maps.
# core-js postinstall is a banner, not a build we need.
allowBuilds:
  "@sentry/cli": false
  core-js: false

# These current releases are younger than pnpm's release-age window. The lockfile still pins them.
minimumReleaseAgeExclude:
  - lucide-react-native@1.52.0
  - lucide-react@1.52.0
  - posthog-js@1.435.9
  - expo@57.0.27
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-router@57.0.25
  - "@expo/cli@57.0.28"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/image-utils@0.11.6"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12"
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - "@expo/ui@57.0.22"
