packages:
  - "apps/*"
  - "packages/*"
  - "packages/features/*"

catalog:
  typescript: 6.0.3
  vitest: 5.0.3
  "@vitest/coverage-v8": 5.0.3
  zod: 4.6.5
  eslint: 10.12.0
  prettier: 3.9.9
  turbo: 2.11.7
  typescript-eslint: 8.71.0
  "@eslint/js": 10.0.1

# @sentry/cli compiles native upload binaries. Milestone 0 does not upload source maps.
# core-js postinstall is a banner, not a build we need.
allowBuilds:
  "@sentry/cli": false
  core-js: false

overrides:
  vite: 8.3.3
  dompurify: 3.4.17

# These current releases are younger than pnpm's release-age window. The lockfile still pins them.
minimumReleaseAgeExclude:
  - lucide-react-native@1.52.0
  - lucide-react@1.52.0
  - posthog-js@1.435.9
  - expo@57.0.27 || 57.0.28 || 57.0.30
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-router@57.0.25 || 57.0.26 || 57.0.28
  - "@expo/cli@57.0.28 || 57.0.29 || 57.0.31"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/image-utils@0.11.6"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17 || 57.0.18"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12 || 57.0.13"
  - babel-preset-expo@57.0.14 || 57.0.15 || 57.0.16
  - expo-asset@57.0.19
  - expo-modules-autolinking@57.0.14 || 57.0.15
  - expo-modules-core@57.0.21 || 57.0.22
  - "@expo/ui@57.0.22 || 57.0.23 || 57.0.25"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - expo-modules-jsi@57.1.2
  - jest-expo@57.0.6
  - expo-notifications@57.0.24
