# Pull request gate, plus post-merge verification on main.
# No deploy, no EAS build, no production promotion, and no hosted Supabase mutation.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request, and one per main push.
  # A newer commit cancels the older run. GitHub binds the result to that
  # commit, so a cancelled or older success cannot stand in for the newest head.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # pnpm store only. Do not cache Supabase, auth, or Playwright state.
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  dependency-audit:
    name: dependency audit exception
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      # Accepted upstream highs warn and exit 0. Any other high or critical fails.
      # Production release stays blocked while the exception file says BLOCKED.
      - name: Compare audit with the residual-risk exception
        run: |
          pnpm audit --json > /tmp/pnpm-audit.json || true
          node --experimental-strip-types --import ./scripts/register-workspace-ts.mjs scripts/check-dependency-exceptions.ts /tmp/pnpm-audit.json

  supabase:
    name: supabase db tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Refuse hosted Supabase credentials
        run: bash .github/workflows/refuse-hosted-supabase.sh

      - name: Require Docker
        run: docker info

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset local database
        run: pnpm exec supabase db reset --local

      # Policy placeholders and login users use different ids. Tests still run
      # on a clean reset, then bootstrap creates the login users.
      - name: Run database tests
        run: pnpm exec supabase test db

      - name: Bootstrap local auth
        run: node --experimental-strip-types --import ./scripts/register-workspace-ts.mjs scripts/bootstrap-local-auth.ts

      - name: Run database tests after auth bootstrap
        run: pnpm exec supabase test db

      - name: Export loopback Supabase env
        run: node --experimental-strip-types --import ./scripts/register-workspace-ts.mjs scripts/ci-local-supabase-env.ts

      - name: Run club context integration test
        run: pnpm --filter @stable/current-club-context exec vitest run src/infrastructure/supabase-club-context-reader.integration.test.ts

  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @stable/web build

  expo:
    name: expo config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Expo config
        run: pnpm --filter @stable/mobile exec expo config --type public

      - name: Expo Doctor
        run: pnpm --filter @stable/mobile exec expo-doctor

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        run: bash .github/workflows/install-google-chrome.sh

      - name: Run Playwright
        run: pnpm --filter @stable/web exec playwright test

  playwright-auth:
    name: playwright authenticated
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check toolchain pins
        run: bash .github/workflows/check-toolchain.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Refuse hosted Supabase credentials
        run: bash .github/workflows/refuse-hosted-supabase.sh

      - name: Require Docker
        run: docker info

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset local database
        run: pnpm exec supabase db reset --local

      - name: Bootstrap local auth
        run: node --experimental-strip-types --import ./scripts/register-workspace-ts.mjs scripts/bootstrap-local-auth.ts

      - name: Export loopback Supabase env
        run: node --experimental-strip-types --import ./scripts/register-workspace-ts.mjs scripts/ci-local-supabase-env.ts

      - name: Install Google Chrome
        run: bash .github/workflows/install-google-chrome.sh

      - name: Run local auth Playwright
        run: |
          export NEXT_PUBLIC_APP_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          unset SUPABASE_SECRET_KEY SECRET_KEY SERVICE_ROLE_KEY
          pnpm --filter @stable/web exec playwright test --config playwright.auth.config.ts

  maestro:
    name: maestro flow parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check Node pin
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          test "$(node -v)" = "v${expected}"
          test "$(node -p 'require("./package.json").engines.node')" = "${expected}"

      # Device-farm Maestro is not installed. This only parses the committed flow.
      - name: Parse Maestro flow
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const file = "apps/mobile/maestro/current-club-context.yaml";
          const text = readFileSync(file, "utf8");
          if (text.trim().length === 0) {
            throw new Error(`${file} is empty`);
          }

          let appId = "";
          let sawSeparator = false;
          const commands = [];
          for (const line of text.split(/\r?\n/)) {
            if (line.startsWith("appId:")) {
              appId = line.slice("appId:".length).trim();
            }
            if (line.trim() === "---") {
              sawSeparator = true;
            }
            const command = /^- (\w+)/.exec(line);
            if (command?.[1] !== undefined) {
              commands.push(command[1]);
            }
          }

          if (appId !== "app.stable.mobile") {
            throw new Error(`${file} must declare appId app.stable.mobile`);
          }
          if (!sawSeparator) {
            throw new Error(`${file} must contain a YAML document separator`);
          }
          if (!commands.includes("launchApp")) {
            throw new Error(`${file} must launch the app`);
          }

          console.log(`parsed ${file}: appId=${appId} commands=${commands.join(",")}`);
          EOF
